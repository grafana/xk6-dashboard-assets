name: Validate

permissions: {}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install yarn
        shell: bash
        run: |
          set -euo pipefail
          corepack enable && corepack prepare yarn@4 --activate

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install

      - name: Build assets
        shell: bash
        run: |
          set -euo pipefail
          yarn build

      - name: Check for changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --name-status

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache: false
          go-version: "1.25.x"

      - name: Test embedded assets
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
